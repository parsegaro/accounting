{% extends "base.html" %}
{% block title %}ویرایش عضو{% endblock %}
{% block content %}
<div class="header-with-controls">
    <h2>ویرایش عضو: {{ staff['name'] }}</h2>
</div>

<div class="card" style="max-width: 500px; margin: auto;">
    <form method="post">
        <div class="form-group">
            <label for="staff-name">نام</label>
            <input type="text" id="staff-name" name="name" class="form-control" value="{{ staff['name'] }}" required>
        </div>
        <div class="form-group">
            <label for="staff-payment-type">نوع پرداخت</label>
            <select id="staff-payment-type" name="payment_type" class="form-control">
                <option value="Monthly" {% if staff['payment_type'] == 'Monthly' %}selected{% endif %}>ماهانه</option>
                <option value="Hourly" {% if staff['payment_type'] == 'Hourly' %}selected{% endif %}>ساعتی</option>
                <option value="Percentage" {% if staff['payment_type'] == 'Percentage' %}selected{% endif %}>درصدی</option>
            </select>
        </div>
        <div class="form-group">
            <label for="staff-payment-rate">نرخ پرداخت (ریال)</label>
            <input type="number" step="any" id="staff-payment-rate" name="payment_rate" value="{{ staff['payment_rate'] }}" class="form-control" required>
            <small>برای نوع درصدی، این مقدار نادیده گرفته میشود.</small>
        </div>
        <div class="form-inline" style="justify-content: flex-end; margin-top: 1.5rem;">
            <a href="{{ url_for('settings') }}" class="btn btn-secondary">انصراف</a>
            <button type="submit" class="btn">ذخیره تغییرات</button>
        </div>
    </form>
</div>
{% endblock %}
