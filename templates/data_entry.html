{% extends "base.html" %}
{% block title %}ورود داده‌های روزانه{% endblock %}
{% block content %}
<h2>ورود داده‌های مالی</h2>

<div class="settings-section">
    <h3>ثبت درآمد روزانه</h3>
    <div class="card">
        <form action="{{ url_for('add_daily_income') }}" method="post">
            <div class="form-group" style="max-width: 200px; margin-bottom: 1rem;">
                <label for="transaction_date">تاریخ تراکنش</label>
                <input type="date" id="transaction_date" name="transaction_date" value="{{ today }}" class="form-control" required>
            </div>

            <div id="income-entries">
                <!-- Entry rows will be added here by JS -->
            </div>

            <button type="button" id="add-income-row" class="btn btn-secondary" style="margin-top: 1rem;">افزودن ردیف خدمت</button>
            <hr>
            <button type="submit" class="btn">ثبت کل درآمد</button>
        </form>
    </div>
</div>

<!-- Expense Form -->
<div class="settings-section">
    <h3>ثبت هزینه</h3>
    <div class="card">
        <form action="{{ url_for('add_expense') }}" method="post">
            <div class="form-inline">
                <div class="form-group" style="max-width: 200px;">
                    <label for="expense-date">تاریخ</label>
                    <input type="date" id="expense-date" name="transaction_date" value="{{ today }}" class="form-control" required>
                </div>
                <div class="form-group" style="flex-grow: 2;">
                    <label for="expense-desc">شرح هزینه</label>
                    <input type="text" id="expense-desc" name="description" class="form-control" required placeholder="مثال: خرید لوازم مصرفی">
                </div>
                <div class="form-group">
                    <label for="expense-amount">مبلغ (ریال)</label>
                    <input type="number" id="expense-amount" name="amount" class="form-control" required placeholder="500000">
                </div>
                <button type="submit" class="btn">ثبت هزینه</button>
            </div>
        </form>
    </div>
</div>

<!-- Ledger Entry Form -->
<div class="settings-section">
    <h3>ثبت بدهی/طلب در دفتر کل</h3>
    <div class="card">
        <form action="{{ url_for('add_ledger_entry') }}" method="post">
            <div class="form-inline">
                <div class="form-group" style="max-width: 200px;">
                    <label for="ledger-date">تاریخ</label>
                    <input type="date" id="ledger-date" name="transaction_date" value="{{ today }}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="ledger-type">نوع</label>
                    <select id="ledger-type" name="type" class="form-control">
                        <option value="Receivable">طلب (باید دریافت کنم)</option>
                        <option value="Payable">بدهی (باید پرداخت کنم)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ledger-entity">طرف حساب</label>
                    <input type="text" id="ledger-entity" name="entity_name" class="form-control" required placeholder="نام بیمار، تامین‌کننده و...">
                </div>
                <div class="form-group" style="flex-grow: 1;">
                    <label for="ledger-desc">شرح</label>
                    <input type="text" id="ledger-desc" name="description" class="form-control" required placeholder="مثال: مابقی هزینه اندوسکوپی">
                </div>
                <div class="form-group">
                    <label for="ledger-amount">مبلغ (ریال)</label>
                    <input type="number" id="ledger-amount" name="amount" class="form-control" required>
                </div>
                <button type="submit" class="btn">ثبت در دفتر</button>
            </div>
        </form>
    </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', function() {
    const services = {{ services|tojson }};
    const container = document.getElementById('income-entries');
    const addRowBtn = document.getElementById('add-income-row');

    function createRow() {
        const row = document.createElement('div');
        row.className = 'form-inline';
        row.style.marginBottom = '1rem';
        row.style.paddingBottom = '1rem';
        row.style.borderBottom = '1px solid #333';

        let options = services.map(s => `<option value="${s.id}">${s.name} (${s.price} ریال)</option>`).join('');

        row.innerHTML = `
            <div class="form-group">
                <label>خدمت</label>
                <select name="service_id[]" class="form-control" required>${options}</select>
            </div>
            <div class="form-group">
                <label>تعداد</label>
                <input type="number" name="quantity[]" class="form-control" value="1" min="1" required>
            </div>
            <button type="button" class="btn btn-danger remove-row-btn" style="align-self: flex-end;">حذف</button>
        `;

        container.appendChild(row);
    }

    if (services.length > 0) {
        createRow();
    } else {
        container.innerHTML = '<p>برای ثبت درآمد، ابتدا باید حداقل یک خدمت را در صفحه <a href="{{ url_for(\'settings\') }}">تنظیمات</a> تعریف کنید.</p>';
        addRowBtn.style.display = 'none';
    }

    addRowBtn.addEventListener('click', createRow);

    container.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('remove-row-btn')) {
            e.target.closest('.form-inline').remove();
        }
    });
});
</script>
{% endblock %}
